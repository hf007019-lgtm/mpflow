name: Deploy MPFlow with Docker

# 当代码被 push 到 main 分支时，自动触发
on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          # 注意：这里的名字会自动读取你的仓库名，不需要你改
          tags: ghcr.io/${{ github.repository }}/mp-frontend:latest
          build-args: |
            NEXT_PUBLIC_API_URL=
            NEXT_PUBLIC_APP_URL=https://mpflowapp.com
          # 禁用 GitHub Actions 内建缓存，强制从零构建并推送
          no-cache: true
          # 仅缓存最终镜像到 registry（下次 pull 可加速），不缓存中间层
          cache-to: type=inline

      - name: Build and push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/mp-backend:latest
          no-cache: true
          cache-to: type=inline

      - name: Deploy to Baota Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          # 这些就是你刚刚在 GitHub 里存好的那些秘密！它会自动去读取
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_PASSWORD }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /www/wwwroot/mpflow
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
            test -f .env
            test -f backend/.env
            docker compose pull
            docker compose up -d
            docker image prune -f
